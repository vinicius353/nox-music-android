name: Android APK
on:
  push:
    branches: [main, 'feature/nox-0.2.0', 'feature/nox-0.3.0-premium']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK (signed with Android debug key)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Music-0.3.0-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
