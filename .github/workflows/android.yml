name: Android APK
on:
  push:
    branches: [main, 'feature/nox-0.2.0', 'feature/nox-0.3.0-premium', 'feature/nox-0.4.0-ytmusic', 'feature/nox-0.5.0-innertune']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch pinned GPL InnerTune innertube source
        run: bash scripts/fetch-innertube.sh
      - name: Configure persistent test signing (optional)
        env:
          NOX_KEYSTORE_BASE64: ${{ secrets.NOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOX_KEYSTORE_BASE64" ]; then
            printf '%s' "$NOX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nox-keystore.jks"
            echo "NOX_KEYSTORE_PATH=$RUNNER_TEMP/nox-keystore.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and test APK
        env:
          NOX_KEYSTORE_PASSWORD: ${{ secrets.NOX_KEYSTORE_PASSWORD }}
          NOX_KEY_ALIAS: ${{ secrets.NOX_KEY_ALIAS }}
          NOX_KEY_PASSWORD: ${{ secrets.NOX_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Music-0.5.0-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
